name: TruckLog
options:
  bundleIdPrefix: com.chrisdrive
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15"

targets:
  TruckLog:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - TruckLog
    entitlements:
      path: TruckLog/TruckLog.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrisdrive.trucklog
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "11"
        DEVELOPMENT_TEAM: 49D2THWCHV
        SWIFT_VERSION: "5.0"
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: TruckLog/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: TruckLog/Info.plist
      properties:
        CFBundleName: TruckLog
        CFBundleDisplayName: TruckLog
        CFBundleVersion: "6"
        CFBundleShortVersionString: "1.0.2"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: "Used to scan rate confirmations and receipts"
        NSPhotoLibraryUsageDescription: "Used to select rate confirmations and receipts"
        NSLocationWhenInUseUsageDescription: "Used to auto-fill your current location as trip origin"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false

schemes:
  TruckLog:
    build:
      targets:
        TruckLog: all
    run:
      config: Debug
    archive:
      config: Release
