workflows:
  fidel-keyboard-testflight:
    name: Fidel Keyboard — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - app_store
      vars:
        BUNDLE_ID: com.embayechris.fidelkeyboard2
        XCODE_SCHEME: App
      xcode: latest
      node: 20

    scripts:
      - name: Install npm dependencies
        script: cd fidel-keyboard && npm install

      - name: Build web app
        script: cd fidel-keyboard && npm run build

      - name: Capacitor sync iOS
        script: cd fidel-keyboard && npx cap sync ios

      - name: Set build number
        script: |
          cd fidel-keyboard/ios/App
          BUILD=$(( $(date -u +%s) - 1740000000 ))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" App/Info.plist || true
          agvtool new-version -all "$BUILD" || true

      - name: Set up keychain and signing
        script: |
          keychain initialize
          echo "$CERTIFICATE_PRIVATE_KEY" | base64 --decode > /tmp/dist.key
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/dist.key \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY
          keychain add-certificates
          cd fidel-keyboard/ios/App && xcode-project use-profiles

      - name: Archive
        script: |
          cd fidel-keyboard/ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/FidelKeyboard.xcarchive

      - name: Export IPA
        script: |
          cd fidel-keyboard/ios/App
          xcodebuild -exportArchive \
            -archivePath build/FidelKeyboard.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/FidelKeyboardExport

    artifacts:
      - fidel-keyboard/ios/App/build/FidelKeyboardExport/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - mebrahatom12@gmail.com
        notify:
          success: true
          failure: true

  fidel-ios-appstore:
    name: Fidel — App Store Upload
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      groups:
        - app_store          # pulls in APP_STORE_CONNECT_* variables
      vars:
        BUNDLE_ID: com.chrisembaye.fidel
        XCODE_SCHEME: Fidel
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd fidel-ios
          xcodegen generate

      - name: Set build number
        script: |
          cd fidel-ios
          BUILD=$((CM_BUILD_NUMBER + 10))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Fidel/Info.plist || true
          agvtool new-version -all "$BUILD" || true

      - name: Set up keychain and signing
        script: |
          keychain initialize

          # Decode the persistent RSA key stored in Codemagic env vars
          echo "$CERTIFICATE_PRIVATE_KEY" | base64 --decode > /tmp/dist.key

          # Fetch or create App Store distribution certificate and provisioning profile
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "$(cat /tmp/dist.key)"

          keychain add-certificates
          cd fidel-ios && xcode-project use-profiles

      - name: Archive
        script: |
          cd fidel-ios
          xcodebuild archive \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Fidel.xcarchive

      - name: Export IPA
        script: |
          cd fidel-ios
          xcodebuild -exportArchive \
            -archivePath build/Fidel.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/FidelExport

    artifacts:
      - fidel-ios/build/FidelExport/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - mebrahatom12@gmail.com
        notify:
          success: true
          failure: true

  trucklog-ios-appstore:
    name: TruckLog — App Store Upload
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      groups:
        - app_store
      vars:
        BUNDLE_ID: com.chrisdrive.trucklog
        XCODE_SCHEME: TruckLog
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd trucklog-ios
          xcodegen generate

      - name: Set build number
        script: |
          cd trucklog-ios
          # CM_BUILD_NUMBER is 0 for manually triggered builds — use timestamp instead
          BUILD=$(( $(date -u +%s) - 1740000000 ))
          echo "==> CFBundleVersion will be: $BUILD"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" TruckLog/Info.plist
          agvtool new-version -all "$BUILD" || true

      - name: Set up keychain and signing
        script: |
          keychain initialize

          echo "$CERTIFICATE_PRIVATE_KEY" | base64 --decode > /tmp/dist.key

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/dist.key \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY

          keychain add-certificates
          cd trucklog-ios && xcode-project use-profiles

      - name: Archive
        script: |
          cd trucklog-ios
          xcodebuild archive \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/TruckLog.xcarchive 2>&1 | grep -E "error:|warning:|note:|ARCHIVE" | head -50 || true
          xcodebuild archive \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/TruckLog.xcarchive

      - name: Export IPA
        script: |
          cd trucklog-ios
          xcodebuild -exportArchive \
            -archivePath build/TruckLog.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/TruckLogExport

    artifacts:
      - trucklog-ios/build/TruckLogExport/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - mebrahatom12@gmail.com
        notify:
          success: true
          failure: true
