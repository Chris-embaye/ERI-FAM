workflows:
  fidel-ios-appstore:
    name: Fidel — App Store Upload
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      groups:
        - app_store          # pulls in APP_STORE_CONNECT_* variables
      vars:
        BUNDLE_ID: com.chrisembaye.fidel
        XCODE_SCHEME: Fidel
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd fidel-ios
          xcodegen generate

      - name: Set build number
        script: |
          cd fidel-ios
          BUILD=$((CM_BUILD_NUMBER + 5))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Fidel/Info.plist || true
          agvtool new-version -all "$BUILD" || true

      - name: Set up keychain and signing
        script: |
          keychain initialize

          # Generate a fresh RSA-2048 private key for the distribution certificate
          openssl genrsa 2048 > /tmp/dist.key 2>/dev/null
          echo "Key header: $(head -1 /tmp/dist.key)"
          echo "Key size: $(wc -c < /tmp/dist.key) bytes"

          # If OpenSSL produced PKCS#8 format, convert to PKCS#1
          if grep -q "BEGIN PRIVATE KEY" /tmp/dist.key; then
            openssl rsa -in /tmp/dist.key -out /tmp/dist.key 2>/dev/null
            echo "Converted to PKCS#1: $(head -1 /tmp/dist.key)"
          fi

          # Fetch or create App Store distribution certificate and provisioning profile
          app-store-connect fetch-signing-files \
            --bundle-identifier "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "$(cat /tmp/dist.key)"

          keychain add-certificates
          cd fidel-ios && xcode-project use-profiles

      - name: Archive
        script: |
          cd fidel-ios
          xcodebuild archive \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Fidel.xcarchive

      - name: Export IPA
        script: |
          cd fidel-ios
          xcode-project build-ipa \
            --archive-path build/Fidel.xcarchive \
            --export-path build/FidelExport

    artifacts:
      - fidel-ios/build/FidelExport/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - mebrahatom12@gmail.com
        notify:
          success: true
          failure: true
