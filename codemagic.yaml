workflows:
  fidel-ios-appstore:
    name: Fidel — App Store Upload
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      groups:
        - app_store          # pulls in APP_STORE_CONNECT_* variables
      vars:
        BUNDLE_ID: com.chrisembaye.fidel
        XCODE_SCHEME: Fidel
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd fidel-ios
          xcodegen generate

      - name: Set build number
        script: |
          cd fidel-ios
          BUILD=$((CM_BUILD_NUMBER + 5))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Fidel/Info.plist || true
          agvtool new-version -all "$BUILD" || true

      - name: Set up keychain and fetch signing files
        script: |
          keychain initialize
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8
          echo "$CERTIFICATE_PRIVATE_KEY" | base64 --decode > /tmp/cert_key.pem
          echo "CERT_KEY length: $(wc -c < /tmp/cert_key.pem)"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --private-key @file:/tmp/AuthKey.p8 \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --certificate-key @file:/tmp/cert_key.pem
          keychain add-certificates
          echo "=== Profiles downloaded ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "No profiles found"
          cd fidel-ios && xcode-project use-profiles

      - name: Archive
        script: |
          cd fidel-ios
          xcodebuild archive \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Fidel.xcarchive

      - name: Export IPA
        script: |
          cd fidel-ios
          xcode-project build-ipa \
            --archive-path build/Fidel.xcarchive \
            --export-path build/FidelExport

    artifacts:
      - fidel-ios/build/FidelExport/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - mebrahatom12@gmail.com
        notify:
          success: true
          failure: true
